<style>
:root{color-scheme:only light;--tile:#cfd9d3;--grout:#a9b6ae;--ink:#16080b;--blood:#d1001c;--dark:#5e000c;--teal:#1f6f6b;--paper:#f4f7f5;--fg:#16080b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--tile);color:var(--ink);font:500 18px 'Barlow Condensed','Arial Narrow',sans-serif}
#app{position:fixed;inset:0;touch-action:none;color:var(--fg);background:radial-gradient(ellipse at 50% 45%,transparent 45%,#0006 100%),linear-gradient(var(--grout) 2px,transparent 2px) 0 0/84px 84px,linear-gradient(90deg,var(--grout) 2px,transparent 2px) 0 0/84px 84px,var(--tile)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);pointer-events:none;text-align:center}
.scr[hidden],.modal[hidden],#hud[hidden]{display:none}
.scr button,.scr a{pointer-events:auto}
h1,h2{font-family:Bungee,Impact,sans-serif;font-weight:400;margin:0;text-transform:uppercase}
h1{font-size:clamp(46px,16vw,92px);line-height:.88;letter-spacing:-2px;transform:rotate(-3deg)}
h1 b{display:block;color:var(--blood);position:relative;text-shadow:3px 3px 0 var(--dark)}
h1 i{position:absolute;top:88%;width:10px;border-radius:0 0 10px 10px;background:var(--blood);animation:dr 3.4s infinite ease-in}
@keyframes dr{0%{height:0}45%{height:46px}85%,100%{height:46px;opacity:0}}
.tag{font-weight:700;font-size:19px;background:var(--ink);color:var(--paper);padding:3px 14px;transform:rotate(1.5deg)}
.btn{font:400 21px Bungee,Impact,sans-serif;color:var(--paper);background:var(--blood);border:0;border-radius:4px;padding:15px 34px;min-width:230px;box-shadow:0 6px 0 var(--dark);transform:skew(-7deg);cursor:pointer}
.btn:active{transform:skew(-7deg) translateY(5px);box-shadow:0 1px 0 var(--dark)}
.btn:disabled{opacity:.4}
.btn.alt{background:var(--ink);box-shadow:0 6px 0 #000}
.lk{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;max-width:380px}
.lk button{font:700 18px 'Barlow Condensed',sans-serif;background:none;border:0;color:var(--fg);text-decoration:underline;text-decoration-color:var(--blood);text-decoration-thickness:3px;text-underline-offset:4px;padding:8px 2px;cursor:pointer}
.ft{font-size:15px;opacity:.7}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 0;pointer-events:none}
#sc{font:400 52px/1 Bungee,Impact,sans-serif;color:var(--fg);text-shadow:3px 3px 0 var(--blood)}
#bs{font-weight:700;font-size:16px;margin-top:4px}
#lv{font-size:26px;letter-spacing:3px}
#fs{font:400 84px/1 Bungee,Impact,sans-serif;color:var(--blood);text-shadow:4px 4px 0 var(--ink)}
.modal{position:absolute;inset:0;background:#16080bd9;display:flex;align-items:center;justify-content:center;padding:18px}
.card{color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:8px 8px 0 var(--blood);width:100%;max-width:520px;max-height:84vh;overflow:auto;padding:20px 22px;text-align:left}
.card h2{font-size:26px;color:var(--blood);margin-bottom:8px}
.card h3{font:400 15px Bungee,Impact,sans-serif;margin:16px 0 4px}
.card p,.card li{line-height:1.3;margin:4px 0;font-size:18px}
.card a{color:var(--blood);font-weight:700;cursor:pointer;text-decoration:underline}
.card .btn{margin-top:16px;width:100%;transform:none}
.ck{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-weight:700}
.ck input{width:24px;height:24px;accent-color:var(--blood);flex:none}
#ob{font:700 20px 'Barlow Condensed',sans-serif;margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;max-width:230px}#ob span{background:var(--paper);border:2px solid var(--ink);padding:0 7px;border-radius:4px}#ob .ok{background:#9be0a8}.st{max-width:420px;font-size:21px;line-height:1.25;font-weight:700}#lg{font:400 30px/1.5 Bungee,Impact,sans-serif}.shp{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:2px dashed var(--grout);padding:8px 0}.shp button{font:400 14px Bungee,Impact;background:var(--ink);color:var(--paper);border:0;padding:9px 12px;border-radius:4px;flex:none}.shp button.on{background:var(--teal)}
#ob span{color:var(--ink)}
#app.dark{--fg:#f4f7f5}
#app.dark .tag{background:var(--blood);color:#fff}
#app.dark .btn.alt{background:#2a0b11;box-shadow:0 6px 0 #000;outline:2px solid var(--dark);outline-offset:-2px}
.cn{width:1.2em;height:1.2em;vertical-align:-.28em;flex:none}
.hr{width:27px;height:27px;margin-left:2px;vertical-align:middle;flex:none}
#lv{white-space:nowrap}
.ic{width:1.25em;height:1.25em;vertical-align:-.3em}
#sk{font:400 17px Bungee,Impact,sans-serif;color:var(--blood);margin-top:6px;text-shadow:2px 2px 0 var(--ink)}
#app.dark #sk{text-shadow:2px 2px 0 #000}
#sk:empty{display:none}
.shp button{display:inline-flex;align-items:center;gap:5px}
.shp .nm{flex:1;text-align:left;line-height:1.1}
.shp .ds{display:block;font-size:15px;opacity:.7;margin-top:2px}
.shp .sw{display:block;width:40px;height:40px;border:2px solid var(--ink);border-radius:4px;flex:none;background-color:#888}
#rk,.rkc{display:flex;align-items:center;gap:8px;font:700 18px 'Barlow Condensed',sans-serif;margin-top:6px;text-align:left}
.rkc{justify-content:center}
.bw{position:relative;display:inline-flex;width:40px;height:40px;flex:none;filter:drop-shadow(0 0 calc(var(--t)*1.8px) var(--c));animation:bp 2.4s ease-in-out infinite}
.bw img{width:100%;height:100%}
.bw{will-change:transform}
.bw.r::before{will-change:transform}
.bw.r::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--c),transparent 30%,var(--c) 60%,transparent);-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%);animation:sp 2s linear infinite}
.bw.e{animation:bp 1.2s ease-in-out infinite,hu 3s linear infinite}
@keyframes bp{50%{transform:scale(1.12)}}
@keyframes sp{to{transform:rotate(1turn)}}
@keyframes hu{from{filter:hue-rotate(0deg) drop-shadow(0 0 14px #fff)}to{filter:hue-rotate(360deg) drop-shadow(0 0 14px #fff)}}
.xb{display:block;width:96px;height:7px;background:#0005;border-radius:4px;overflow:hidden;margin-top:2px}
.xb i{display:block;height:100%;background:var(--c,var(--blood));animation:none;position:static;width:auto;border-radius:0}
#pz{pointer-events:auto;font:400 20px/1 Bungee,Impact,sans-serif;letter-spacing:-2px;width:48px;height:48px;border:0;border-radius:6px;background:var(--ink);color:var(--paper);box-shadow:0 4px 0 var(--blood);cursor:pointer}

#app.dark #pz{background:#2a0b11;outline:2px solid var(--dark);outline-offset:-2px}

#pause h2{font-size:38px;color:var(--blood);text-shadow:3px 3px 0 #000}
#pause .btn.alt{background:#2a0b11;outline:2px solid var(--dark);outline-offset:-2px}

.cl small{font:700 15px 'Barlow Condensed',sans-serif}
.un{filter:brightness(0);opacity:.28}

/* ===== TÍTULOS ===== */
.ti{position:relative;display:inline-block;font:400 15px/1.15 Bungee,Impact,sans-serif;letter-spacing:.3px;padding:6px 13px;border-radius:5px;transform:skew(-6deg);white-space:nowrap;border:2px solid #0008;box-shadow:0 3px 0 #0009;text-align:center}
.ti::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%) 150% 0/250% 100% no-repeat}
.t2::before,.t3::before,.t4::before,.t5::before,.t6::before,.t7::before,.t8::before,.t9::before,.t10::before{animation:tsh 2.8s linear infinite}
@keyframes tsh{to{background-position:-150% 0}}
.t0{background:#2a0b11;color:#ff6577;border-color:#d1001c}
.t1{background:linear-gradient(90deg,#d1001c,#a0107a 50%,#1e5bd6);color:#fff;text-shadow:1px 1px 0 #000}
.t2{background:linear-gradient(180deg,#e8fbff,#8fd0ff);color:#0b2a3a;border-color:#fff;box-shadow:0 0 14px #7fe8ff,0 3px 0 #0009;animation:tfl 3s ease-in-out infinite}
@keyframes tfl{50%{transform:skew(-6deg) translateY(-3px)}}
.t3{background:radial-gradient(ellipse at 50% 0,#6a5300,#16080b 75%);color:#fff6b0;border-color:#fff6b0;text-shadow:0 0 8px #fff6b0;box-shadow:0 0 14px #fff6b0aa,0 3px 0 #0009}
.t4{background:linear-gradient(0deg,#ff2a00,#ff7a00 55%,#ffc400);color:#2a0300;border-color:#7a1200;box-shadow:0 0 14px #ff7a00,0 3px 0 #0009;animation:tfi .9s ease-in-out infinite alternate}
@keyframes tfi{to{box-shadow:0 0 22px #ffb300,0 3px 0 #0009;filter:brightness(1.15)}}
.t5{background:repeating-linear-gradient(135deg,#1f3d1c 0 8px,#2c5427 8px 16px);color:#c8ff8a;border-color:#7dff00;text-shadow:1px 1px 0 #000}
.t6{background:linear-gradient(135deg,#2a0040,#8e0012);color:#ffb3ff;border-color:#e11d74;box-shadow:0 0 16px #9b30ff,0 3px 0 #0009;text-shadow:0 0 8px #e11d74}
.t7{background:linear-gradient(180deg,#d1001c,#5e000c);color:#fff;border-color:#2a0007;text-shadow:2px 2px 0 #2a0007;margin-bottom:14px}
.t8{background:linear-gradient(135deg,#00bcd4,#9b30ff);color:#fff;border-color:#fff;box-shadow:0 0 14px #c9a6ff,0 3px 0 #0009;animation:thu 4s linear infinite}
@keyframes thu{to{filter:hue-rotate(360deg)}}
.t9{background:linear-gradient(135deg,#16080b,#8e0012 50%,#16080b);color:#fff;border-color:#ff2a3d;box-shadow:0 0 18px #ff2a3d,0 3px 0 #0009;text-shadow:0 0 8px #ff2a3d;animation:tpu 1.6s ease-in-out infinite}
@keyframes tpu{50%{box-shadow:0 0 28px #ff2a3d,0 3px 0 #0009}}
.t10{background:radial-gradient(circle at 16% 0,#b3001a 0 7px,transparent 8px),radial-gradient(circle at 61% 0,#b3001a 0 9px,transparent 10px),radial-gradient(circle at 91% 0,#8e0012 0 6px,transparent 7px),linear-gradient(180deg,#fff3b0,#ffc400 40%,#d99b10 70%,#8f5805);color:#4a0008;border-color:#fff3b0;font-size:17px;box-shadow:0 0 20px #ffc400,0 0 6px #fff3b0,0 3px 0 #4a2a02;text-shadow:0 1px 0 #fff3b0;animation:tgo 2s ease-in-out infinite;margin-bottom:18px}
@keyframes tgo{50%{box-shadow:0 0 32px #ffd84a,0 0 10px #fff3b0,0 3px 0 #4a2a02}}
.tn{background:#16080b;color:#f4f7f5;border:2px dashed #d1001c;opacity:.9}
.ti i{position:absolute;top:92%;width:5px;height:0;border-radius:0 0 5px 5px;background:#b3001a;pointer-events:none;animation:tdr 3s infinite ease-in}
.ti i:nth-of-type(1){left:14%}.ti i:nth-of-type(2){left:46%;animation-delay:1s}.ti i:nth-of-type(3){left:78%;animation-delay:2s}
@keyframes tdr{0%{height:0;opacity:1}50%{height:14px}85%,100%{height:14px;opacity:0}}
.ti.lc{animation:none;filter:grayscale(1) brightness(.55);box-shadow:none;opacity:.75}
.ti.lc::before,.ti.lc i{display:none}
#ttb{background:none;border:0;padding:4px 6px;margin:0;cursor:pointer;pointer-events:auto;font:inherit}
.tr{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px dashed var(--grout);padding:12px 0 14px}
.tr .tx{flex:1;min-width:0}
.tr .ds{display:block;font-size:16px;line-height:1.15;opacity:.75;margin-top:7px}
.pb{height:6px;background:#16080b26;border-radius:3px;margin-top:6px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--blood)}
.tb{font:400 14px Bungee,Impact,sans-serif;background:var(--ink);color:var(--paper);border:0;padding:10px 12px;border-radius:4px;flex:none;min-width:92px;cursor:pointer}
.tb.on{background:var(--teal)}.tb:disabled{opacity:.4}
@media(max-height:720px){#menu{gap:8px}}
/* ===== PRESTIGIO / RULETA / LEGENDARIOS ===== */
.pst{color:#ffc400;text-shadow:1px 1px 0 #16080b,-1px -1px 0 #16080b,1px -1px 0 #16080b,-1px 1px 0 #16080b;font-weight:700;margin-left:2px}
.lk button.av::after{content:" ●";color:#d1001c;text-decoration:none;display:inline-block}
.cg3{grid-template-columns:repeat(3,1fr)}
.cl.lg{font-size:30px;padding:7px 2px}
.cl.lg small{text-align:center;line-height:1.05}
#wh{position:static;inset:auto;display:block;margin:8px auto;width:min(280px,100%);aspect-ratio:1/1;height:auto}
.card a[href^="mailto"]{-webkit-user-select:text;user-select:text;overflow-wrap:anywhere}

@media(prefers-reduced-motion:reduce){.ti,.ti::before,.ti i{animation:none!important}}

how:['Cómo jugar','<p>Desliza el dedo para cortar los emojis antes de que caigan.</p><ul><li>Cada capítulo pide cortar emojis concretos (los del aro rojo). Cumple la lista para avanzar en la historia.</li><li>Si dejas caer un emoji de la lista pierdes una vida. Tienes 3.</li><li>Los inocentes '+ico('😇',1)+' cuestan una vida si los cortas.</li><li>Ganas monedas '+CN+' y las gastas en la Tienda. Son virtuales, no cuestan dinero real.</li><li>No cortes la bomba '+ico('💣')+': te cuesta una vida y explota en sangre. Al perder las 3 vidas se acaba la partida.</li><li>Las mitades se pueden seguir cortando: cada tajo extra da más sangre, puntos y XP. A la tercera pasada se pulveriza.</li><li>Cortar da XP: sube hasta el nivel 100 y desbloquea rangos: Principiante (10), Asesino (20), Asesino serial (30), Sicópata (40), Sicópata N2 (50), N3 (60), N4 (70), Sicario (80), Sicario Mayor (90) y Asesino Élite (100). Cada rango estrena una insignia con más efectos.</li><li>El reloj '+ico('⏳')+' activa la cámara lenta durante 5 segundos.</li><li>Cortar 3 o más emojis en un solo tajo activa combos: Triple, Cuádruple, Pentagore y más, con bonus de puntos y monedas.</li><li>Corta sin parar para subir la racha: cada 6 cortes sube el multiplicador (hasta x5). Con 15 de racha entras en Frenesí.</li><li>En la Tienda compras hojas, fondos, efectos de eliminación y mejoras.</li><li>Cada emoji que cortas se guarda en el Cementerio, con un álbum de víctimas y títulos que se desbloquean.</li><li>Al terminar la partida puedes sacar la Foto de la masacre: tu piso ensangrentado con puntaje, nivel y rango.</li><li><b>Armas especiales:</b> desde el Cap. 3 cada capítulo trae un arma. La <b>Guillotina</b>: toca la pantalla sin deslizar y cae una cuchilla recta que corta todo en su línea (recarga 7 s). La <b>Motosierra</b>: mantén el dedo quieto y despedaza todo a tu alrededor (dura 2,5 s y se recarga). Ojo: también cortan bombas e inocentes.</li><li><b>Legendarios:</b> con un 1% de probabilidad aparece terms:['Términos y condiciones','<p>Última actualización: 2026.</p><h3>1. Aceptación</h3><p>Al jugar Court Gore PDH («el Juego») aceptas estos términos. Si no estás de acuerdo, no uses el Juego.</p><h3>2. Edad y contenido</h3><p>El Juego es solo para mayores de 18 años. Contiene violencia gráfica ficticia y estilizada (emojis desmembrados, sangre abundante y vísceras de dibujo animado), luces rojas intermitentes y sonidos fuertes. No representa ni promueve violencia contra personas reales.</p><h3>3. Fotosensibilidad</h3><p>Los destellos rojos y blancos pueden afectar a personas con epilepsia fotosensible. Si sientes mareo o molestias, deja de jugar y consulta a un profesional de la salud.</p><h3>4. Licencia de uso</h3><p>Samuel PDH te concede una licencia personal, no comercial, no exclusiva y revocable para jugar. No puedes copiar, vender, redistribuir, descompilar ni modificar el Juego sin permiso por escrito.</p><h3>5. Propiedad intelectual</h3><p>El código, el diseño, el nombre y la marca «Court Gore PDH» pertenecen a Samuel PDH. Los emojis se dibujan con la fuente de tu dispositivo y pertenecen a sus respectivos titulares.</p><h3>6. Conducta</h3><p>No uses trampas, automatizaciones ni ingeniería inversa para alterar el funcionamiento o las puntuaciones.</p><h3>7. Sin garantías</h3><p>El Juego se ofrece «tal cual», sin garantía de funcionamiento continuo ni libre de errores.</p><h3>8. Limitación de responsabilidad</h3><p>En la medida permitida por la ley, Samuel PDH no responde por daños derivados del uso del Juego.</p><h3>9. Cambios</h3><p>Podemos actualizar estos términos. Seguir jugando implica aceptar la versión vigente.</p><h3>10. Contacto</h3><p>Consultas legales: Samuel PDH, a través del canal donde obtuviste el Juego.</p>'],
priv:['Política de privacidad','<p>Última actualización: 2026.</p><h3>Datos personales</h3><p>No recopilamos datos personales. No pedimos nombre, correo, ubicación, cámara ni micrófono, y no hay cuentas de usuario.</p><h3>Almacenamiento local</h3><p>Guardamos en tu propio dispositivo (localStorage) solo tu progreso, nivel, XP, monedas, compras, prestigio, legendarios descubiertos, la fecha de tu última ruleta, mejor puntuación y que aceptaste los términos. Nunca sale de tu dispositivo y se borra al limpiar los datos del sitio.</p><h3>Terceros</h3><p>No hay anuncios, analíticas ni rastreadores. Las tipografías se cargan desde Google Fonts, por lo que Google puede recibir tu dirección IP y datos técnicos estándar de la solicitud, según su propia política.</p><h3>Menores</h3><p>El Juego no está dirigido a menores de 18 años y no recopilamos datos de ellos a sabiendas.</p><h3>Tus derechos</h3><p>Puedes borrar tus datos locales en cualquier momento desde los ajustes de tu navegador.</p><h3>Cambios</h3><p>Si esta política cambia, publicaremos la nueva versión aquí con su fecha.</p>'],

<script>
(()=>{
/* 1. Dejar caer un emoji ya no quita vida: solo se pierde y vuelve a salir. Siguen quitando vida las bombas y los inocentes */
const _lose=lose;
lose=function(it,b){if(!b)return;_lose(it,b)};

/* 2. Nivel 100 mucho más difícil: el XP se divide entre 6 (con la mejora "Entrenamiento" sube un 50%) */
const _gain=gain;
gain=function(n){n*=(own.ex?1.5:1)/6;let k=Math.floor(n);if(R()<n-k)k++;if(k>0)_gain(k)};

/* 3. Mejora "Bombas escasas" */
const _launch=launch;
launch=function(){const n=items.length;_launch();const it=items[items.length-1];if(own.ms&&items.length>n&&it.k=='b'&&R()<.45){it.k='e';it.e=E[R()*E.length|0]}};

/* 4. Mejora "Segundo corazón extra" */
const _begin=begin;
begin=function(l,k){_begin(l,k);if(own.h2){lives++;hud()}};

/* 5. Tienda: precios mucho más altos y objetos nuevos */
const P={b1:1500,b2:3000,b3:4500,b4:7000,b5:15000,hm:2000,hl:3500,sl:2500,cd:6000,sk:4000,f1:2500,f2:4000,f3:5500,f4:8000,f5:12000,x1:3000,x2:5000,x3:6500,x4:8000,x5:10000};
SH.forEach(s=>{if(P[s[0]])s[2]=P[s[0]]});
SH.push(
['b6','Hoja neón',5500,'#ff4fd8'],['b7','Hoja escarcha',6500,'#bff4ff'],['b9','Hoja esmeralda',8000,'#2ee66b'],['b8','Hoja abismo',9000,'#9b30ff'],
['ms','Bombas escasas: salen menos bombas',8000],['h2','Segundo corazón extra: +1 vida más',9000],['ex','Entrenamiento: +50% de XP',30000],
['x6','Veneno',7000,0,'Salpicaduras tóxicas verdes.'],['x7','Supernova',14000,0,'Una explosión dorada en cada corte.'],['x8','Oscuridad',18000,0,'Humo negro y relámpagos púrpura.']);
SH.forEach(s=>s[3]&&(BC[s[0]]=s[3]));

/* 6. Efectos de eliminación nuevos */
const _kfx=kfx;
kfx=function(x,y,a,big){const n=big?2:1;
if(fxk=='x6'){for(let i=0;i<22*n;i++){const b=R()*6.28,v=150+R()*450;pp({t:'p',x,y,vx:Math.cos(b)*v,vy:Math.sin(b)*v-80,g:200,r:5+R()*9,l:.6+R()*.7,c:['#7dff00','#3ec800','#c8ff8a'][R()*3|0],a:1})}ring(x,y,'#7dff00',S*1.1,8);fc='125,255,0';flash=.4}
else if(fxk=='x7'){for(let i=0;i<28*n;i++){const b=R()*6.28,v=400+R()*700;pp({t:'l',x,y,vx:Math.cos(b)*v,vy:Math.sin(b)*v,r:2+R()*3,l:.3+R()*.3,c:'#ffd84a',a:1})}ring(x,y,'#ffd84a',S*1.4,10);ring(x,y,'#fff3b0',S*.8,6);fc='255,216,74';flash=.55}
else if(fxk=='x8'){for(let i=0;i<18*n;i++){const b=R()*6.28,v=100+R()*350;pp({t:'p',x,y,vx:Math.cos(b)*v,vy:Math.sin(b)*v-60,g:-40,r:12+R()*16,l:.8+R()*.7,c:'#2a0040'})}for(let i=0;i<2+n;i++)bolt(x,y,R()*6.28,S*(.8+R()*.8),'#c9a6ff');ring(x,y,'#9b30ff',S*1.2,8);fc='90,0,140';flash=.5}
else _kfx(x,y,a,big)};

/* 7. Texto de ayuda */
LEG.how[1]=LEG.how[1].replace('Si dejas caer un emoji de la lista pierdes una vida. Tienes 3.','Si se te escapa un emoji de la lista no pierdes nada: vuelve a salir. Solo pierdes vidas con bombas e inocentes. Tienes 3.');

/* 8. Panel de administrador: 3 toques en la esquina superior izquierda muestran el punto rojo */
const sty=document.createElement('style');
sty.textContent='input{-webkit-user-select:text;user-select:text}#adm{position:absolute;left:0;top:env(safe-area-inset-top,0px);width:44px;height:44px;padding:0;border:0;background:transparent;pointer-events:auto;cursor:pointer;z-index:6}#adm::after{content:"";position:absolute;left:6px;top:6px;width:7px;height:7px;border-radius:50%;background:#d1001c;opacity:0}#adm.on::after{opacity:.7}#apw{width:100%;font:700 22px "Barlow Condensed",sans-serif;padding:10px 12px;border:3px solid #16080b;border-radius:4px;background:#fff;color:#16080b}';
document.head.appendChild(sty);
const ab=document.createElement('button');ab.id='adm';ab.setAttribute('aria-label','Admin');$('#menu').appendChild(ab);

SH.forEach(s=>{own[s[0]]=1});
xp=Math.max(xp,XF(100));ls.s('cgp_xp',xp);

<script>
/* MÚSICA de terror suave */
(()=>{
const VOL=.10;
let mc=null,mg=null,on=0;
function init(){
if(mc)return;
try{mc=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
mg=mc.createGain();mg.gain.value=0;mg.connect(mc.destination);
const lp=mc.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;lp.Q.value=.7;lp.connect(mg);
[[55,'triangle',.06],[55.5,'sawtooth',.025],[82.4,'triangle',.05],[58.3,'sine',.06]].forEach(([f,t,v])=>{
const o=mc.createOscillator(),g=mc.createGain(),l=mc.createOscillator(),lg=mc.createGain();
o.type=t;o.frequency.value=f;g.gain.value=v;
l.frequency.value=.05+Math.random()*.08;lg.gain.value=v*.6;l.connect(lg);lg.connect(g.gain);
o.connect(g);g.connect(lp);o.start();l.start()});
const fl=mc.createOscillator(),fg=mc.createGain();fl.frequency.value=.07;fg.gain.value=120;fl.connect(fg);fg.connect(lp.frequency);fl.start();
const dl=mc.createDelay(1.5),fb=mc.createGain();dl.delayTime.value=.55;fb.gain.value=.45;dl.connect(fb);fb.connect(dl);dl.connect(mg);
window._mdl=dl;
note()}
function note(){
setTimeout(note,5000+Math.random()*9000);
if(!on||!mc||mc.state!=='running')return;
const f=[466.16,349.23,277.18,311.13,233.08][Math.random()*5|0],t=mc.currentTime,o=mc.createOscillator(),g=mc.createGain();
o.type='sine';o.frequency.value=f;
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.03,t+2);g.gain.exponentialRampToValueAtTime(.0005,t+7);
o.connect(g);g.connect(mg);g.connect(window._mdl);o.start(t);o.stop(t+7.5)}
function go(){init();if(mc&&mc.state!=='running')mc.resume().catch(()=>{});on=1}
addEventListener('pointerup',go);addEventListener('click',go);addEventListener('keydown',go);
setInterval(()=>{if(!mc)return;let m=false;try{m=mute}catch(e){}
const v=(on&&!m&&!document.hidden)?VOL:0;mg.gain.setTargetAtTime(v,mc.currentTime,.6)},250);
})();
  </script>
